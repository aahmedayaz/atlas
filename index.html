<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineering Atlas — learn software engineering step by step</title>
<meta name="description" content="A free, interactive engineering course: every idea is an animated diagram you step through, with code, interview reasoning, scenarios and history.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // apply the saved theme before first paint so the page never flashes
  try { var t = localStorage.getItem('atlas:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<noscript>This course needs JavaScript to run its animated diagrams.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
